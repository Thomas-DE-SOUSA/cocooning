# Production stack of Cocooning on the VM (platform decision 0015).
# Run from the repository root:
#   docker compose -f infrastructure/compose/docker-compose.prod.yml up -d --build
# Secrets come from infrastructure/compose/.env (copied from .env.example, never versioned).
name: cocooning

services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: cocooning
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infrastructure/compose/.env}
            POSTGRES_DB: cocooning
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U cocooning -d cocooning']
            interval: 5s
            timeout: 3s
            retries: 20

    migrate:
        build:
            context: ../..
            dockerfile: infrastructure/docker/nest/Dockerfile
            target: runner-init
        environment:
            DATABASE_POSTGRES_URL: postgresql://cocooning:${POSTGRES_PASSWORD}@postgres:5432/cocooning
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'

    api:
        build:
            context: ../..
            dockerfile: infrastructure/docker/nest/Dockerfile
            target: runner
        restart: unless-stopped
        init: true
        environment:
            PORT: 3100
            LOG_LEVEL: info
            LOG_PRETTY: 'false'
            DATABASE_POSTGRES_URL: postgresql://cocooning:${POSTGRES_PASSWORD}@postgres:5432/cocooning
            DB_TX_TIMEOUT_MS: 5000
            DB_TX_MAX_WAIT_MS: 2000
            AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in infrastructure/compose/.env}
            AUTH_SESSION_TTL_DAYS: 90
            PAIRING_INVITATION_CODE_TTL_HOURS: 48
            # The scheduled task of the daily photo prompt (R7 of messaging), inside the API process.
            PHOTO_PROMPT_SCHEDULER_ENABLED: 'true'
            # The outbox relay and its Web Push notifications (R10 of messaging, decision 0021), inside the API process.
            OUTBOX_RELAY_ENABLED: 'true'
            # VAPID pair and subject of the Web Push notifications (R11); the private key never leaves the API.
            WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?set WEB_PUSH_VAPID_PUBLIC_KEY in infrastructure/compose/.env}
            WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:?set WEB_PUSH_VAPID_PRIVATE_KEY in infrastructure/compose/.env}
            WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:?set WEB_PUSH_VAPID_SUBJECT in infrastructure/compose/.env}
            # The search engine of the smart folders (decision 0054), on the internal network of the compose.
            WEB_SEARCH_SEARXNG_URL: http://searxng:8080
            WEB_SEARCH_TIMEOUT_MS: 8000
            # The free Gemini of the smart folders (decision 0054): it proposes templates and writes the cards.
            NOTE_CARD_GEMINI_API_KEY: ${NOTE_CARD_GEMINI_API_KEY:?set NOTE_CARD_GEMINI_API_KEY in infrastructure/compose/.env}
            NOTE_CARD_GEMINI_MODEL: gemini-3.5-flash-lite
            # The instant photos (decision 0027), kept in the files volume.
            FILE_STORAGE_DIRECTORY: /data/files
        volumes:
            - files:/data/files
        depends_on:
            migrate:
                condition: service_completed_successfully
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:3100/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 30s
            timeout: 5s
            retries: 3

    # The web shares the network of the tailscale service: Tailscale serves it
    # in HTTPS on https://cocooning.<tailnet>.ts.net, nothing listens on the VM.
    web:
        build:
            context: ../..
            dockerfile: infrastructure/docker/next/Dockerfile
            target: runner
        restart: unless-stopped
        init: true
        environment:
            API_URL: http://api:3100
            API_TIMEOUT_MS: 5000
            NOTES_COLLABORATION_URL: ${NOTES_COLLABORATION_URL:?set NOTES_COLLABORATION_URL in infrastructure/compose/.env}
        network_mode: service:tailscale
        depends_on:
            - tailscale
            - api

    tailscale:
        image: tailscale/tailscale:v1.104.7
        hostname: cocooning
        restart: unless-stopped
        environment:
            TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in infrastructure/compose/.env}
            TS_STATE_DIR: /var/lib/tailscale
            TS_SERVE_CONFIG: /config/serve.json
        volumes:
            - tailscale-state:/var/lib/tailscale
            - ./tailscale:/config:ro

volumes:
    postgres-data:
    files:
    tailscale-state:
