# Explicit depth: a deeper folder with a package.json must never join the
# workspace by accident (Malta's `apps/**` pulled in a nested dev server).
packages:
  - "apps/*/*"
  - "packages/*"
  - "packages/*/*"
  - "config/*"
  - "cli/*/*"
  - "tests/*"

# A version must be at least one day old before pnpm installs it.
minimumReleaseAge: 1440

publicHoistPattern:
  - "@babel/*"

# Kept as with pnpm 10, which ran no dependency build script: allow one only
# once a package needs it.
allowBuilds:
  "@nestjs/core": false
  "@parcel/watcher": false
  "@prisma/engines": false
  "@swc/core": false
  "@tailwindcss/oxide": false
  argon2: false
  cpu-features: false
  esbuild: false
  prisma: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false

# Named catalogs only: there is no default catalog, `catalog:` alone is not
# used. A catalog groups what is upgraded together and is created when its
# first dependency arrives (nest, prisma, validation, next, react, styles come
# with their phase).
catalogs:
  build:
    "@types/node": ^22.20.5
    typescript: ~6.0.3

  tooling:
    "@commitlint/cli": ^21.2.4
    "@commitlint/config-conventional": ^21.2.4
    husky: ^9.1.7
    lint-staged: ^17.6.1
    turbo: 2.11.13
    dotenv-cli: ^11.1.0
    tsc-watch: ^7.2.1
    validate-branch-name: ^1.3.2

  lint:
    "@eslint/js": ^10.0.1
    eslint: ^10.15.0
    eslint-config-prettier: ^10.1.8
    eslint-plugin-boundaries: ^7.4.4
    eslint-plugin-turbo: 2.11.13
    globals: ^17.14.0
    prettier: ^3.10.1
    typescript-eslint: ^8.73.0
    "@eslint-react/eslint-plugin": ^5.30.6
    eslint-plugin-react-hooks: ^7.1.1

  # Pinned to major 11: NestJS 12 ships ESM only (platform decision 0011).
  nest:
    "@nestjs/common": ^11.2.11
    # @nestjs/config 12 and @nestjs/jwt 12 ship ESM only (platform decision 0011).
    "@nestjs/config": ^4.0.4
    "@nestjs/core": ^11.2.11
    "@nestjs/jwt": ^11.0.2
    "@nestjs/platform-express": ^11.2.11
    "@nestjs/testing": ^11.2.11
    "@types/cookie-parser": ^1.4.10
    "@types/express": ^5.0.6
    cookie-parser: ^1.4.7
    reflect-metadata: ^0.2.2
    rxjs: ^7.8.2

  prisma:
    "@prisma/adapter-pg": ^7.10.1
    "@prisma/client": ^7.10.1
    prisma: ^7.10.1

  validation:
    zod: ^4.6.7

  security:
    argon2: ^0.45.2

  logger:
    pino: ^10.4.0
    pino-pretty: ^13.2.0

  # Pinned to major 11: uuid 12 and later ship ESM only (platform decision 0011).
  identifier:
    uuid: ^11.1.1

  integration:
    "@testcontainers/postgresql": ^11.14.0

  test:
    "@types/jest": ^30.0.0
    jest: ^30.5.2
    ts-jest: ^29.4.15
    "@testing-library/react": ^16.3.3
    jest-environment-jsdom: ^30.5.2
    "@testing-library/user-event": ^14.6.13

  react:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1

  next:
    "@next/eslint-plugin-next": ^16.4.6
    next: ^16.4.6
    "@t3-oss/env-nextjs": ^0.13.11
    server-only: ^0.0.1

  pwa:
    "@serwist/next": ^9.5.15
    serwist: ^9.5.15

  i18n:
    i18next: ^27.2.0
    react-i18next: ^18.0.3

  styles:
    "@tailwindcss/postcss": ^4.3.5
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    sonner: ^2.0.8
    tailwind-merge: ^3.7.1
    tailwindcss: ^4.3.5

  icons:
    lucide-react: ^1.77.0

  calendar:
    react-day-picker: ^10.0.2

  forms:
    "@hookform/resolvers": ^7.0.8
    react-hook-form: ^7.92.0
  collaboration:
    "@hocuspocus/server": ^4.9.0
    "@hocuspocus/provider": ^4.9.0
    "@tiptap/extension-collaboration": ^3.35.0
    "@tiptap/extension-list": ^3.35.0
    "@tiptap/pm": ^3.35.0
    "@tiptap/react": ^3.35.0
    "@tiptap/starter-kit": ^3.35.0
    "@tiptap/y-tiptap": ^3.3.1
    "@types/ws": ^8.18.1
    ws: ^8.18.3
    y-protocols: ^1.0.7
    yjs: ^13.6.33
